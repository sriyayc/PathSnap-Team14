<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PathSnap Evaluator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg:#0b0f17; --panel:#111827; --panel2:#161f30; --line:#233047; --ink:#e6ebf5; --muted:#8a96ad;
    --route:#ff4d6d; --gps:#38bdf8; --clf:#fbbf24; --ok:#34d399; --accent:#7c5cff;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:14px/1.5 Inter, system-ui, Segoe UI, sans-serif; color:var(--ink); background:var(--bg); }
  header { height:64px; padding:0 20px; display:flex; align-items:center; gap:18px; background:linear-gradient(90deg,#0f1524,#121a2c);
           border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; letter-spacing:.2px; white-space:nowrap; }
  .logo { width:30px; height:30px; border-radius:9px; background:conic-gradient(from 200deg,var(--route),var(--accent),var(--gps),var(--route));
          box-shadow:0 0 18px rgba(124,92,255,.45); position:relative; }
  .logo::after { content:""; position:absolute; inset:8px; border-radius:50%; background:var(--bg); }
  .brand small { font-weight:500; color:var(--muted); font-size:13px; margin-left:2px; }
  .apibox { display:flex; align-items:center; gap:8px; margin-left:auto; }
  .apibox label { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
  .leaflet-control-layers label { display:flex; align-items:center; gap:7px; margin:3px 0; cursor:pointer; }
  .leaflet-control-layers input { accent-color:var(--accent); margin:0; }
  #api { width:260px; padding:8px 11px; color:var(--ink); background:var(--panel2); border:1px solid var(--line); border-radius:9px;
          font:13px "JetBrains Mono", Consolas, monospace; outline:none; }
  #api:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(124,92,255,.2); }
  button { font:inherit; cursor:pointer; }
  .btn { padding:8px 16px; border:0; border-radius:9px; color:#fff; font-weight:600;
         background:linear-gradient(135deg,var(--accent),#5b8cff); box-shadow:0 4px 14px rgba(124,92,255,.35); }
  .btn:hover { filter:brightness(1.1); }
  .pill { display:flex; align-items:center; gap:7px; padding:5px 11px; border-radius:999px; background:var(--panel2);
          border:1px solid var(--line); color:var(--muted); font-size:12.5px; max-width:340px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .dot { width:8px; height:8px; border-radius:50%; background:#64748b; flex:none; }
  .pill.ok .dot { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .pill.busy .dot { background:var(--clf); box-shadow:0 0 8px var(--clf); animation:pulse 1s infinite; }
  .pill.err .dot { background:var(--route); box-shadow:0 0 8px var(--route); }
  @keyframes pulse { 50% { opacity:.3; } }

  main { display:grid; grid-template-columns:340px 1fr; height:calc(100vh - 64px); }
  aside { background:var(--panel); border-right:1px solid var(--line); overflow:auto; padding:18px; }
  aside h2 { font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); margin:4px 0 10px; }
  #trips { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:22px; }
  .trip { padding:9px 10px; text-align:left; color:var(--ink); background:var(--panel2); border:1px solid var(--line); border-radius:10px;
          font:13px "JetBrains Mono", Consolas, monospace; transition:.15s; }
  .trip:hover { border-color:#3a4b6b; transform:translateY(-1px); }
  .trip.active { border-color:var(--route); background:rgba(255,77,109,.1); box-shadow:0 0 0 1px var(--route), 0 0 16px rgba(255,77,109,.25); }
  .hint { color:var(--muted); grid-column:1/-1; font-size:13px; }

  .hero { padding:16px; border-radius:14px; background:linear-gradient(145deg,rgba(255,77,109,.16),rgba(124,92,255,.12));
          border:1px solid rgba(255,77,109,.35); margin-bottom:12px; }
  .hero .k { color:#ffc2cd; font-size:12px; text-transform:uppercase; letter-spacing:.1em; }
  .hero .v { font-size:40px; font-weight:700; line-height:1.1; margin:4px 0 6px; font-variant-numeric:tabular-nums; }
  .gain { display:inline-block; padding:3px 9px; border-radius:999px; font-size:12px; font-weight:600; color:#062e22; background:var(--ok); }
  .sub { color:var(--muted); font-size:12.5px; margin-left:6px; }
  .bars { display:grid; gap:9px; margin:14px 0; }
  .bar .row { display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); margin-bottom:4px; }
  .bar .row b { color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }
  .track { height:6px; border-radius:6px; background:#1e293b; overflow:hidden; }
  .fill { height:100%; border-radius:6px; background:linear-gradient(90deg,var(--accent),var(--gps)); }
  .fill.clf { background:var(--clf); }
  .meta { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .chip { padding:9px 11px; border-radius:10px; background:var(--panel2); border:1px solid var(--line); }
  .chip .k { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .chip .v { font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; }
  .foot { color:var(--muted); font-size:12px; margin-top:12px; line-height:1.55; }
  .foot code { font-family:"JetBrains Mono", Consolas, monospace; color:var(--ink); }
  .spinner { width:28px; height:28px; border-radius:50%; border:3px solid #1e293b; border-top-color:var(--accent); animation:spin .8s linear infinite; margin:18px auto; }
  @keyframes spin { to { transform:rotate(360deg); } }

  #map { height:100%; background:#0b0f17; }
  .dark-tiles { filter: invert(100%) hue-rotate(195deg) saturate(28%) brightness(92%) contrast(105%); }
  .se-marker { width:14px; height:14px; border-radius:50%; border:3px solid #0b0f17; }
  .leaflet-container { font-family:Inter, system-ui, sans-serif; }
  .leaflet-control-layers, .legend { background:rgba(17,24,39,.92)!important; color:var(--ink)!important; border:1px solid var(--line)!important;
                                     border-radius:12px!important; box-shadow:0 8px 24px rgba(0,0,0,.4)!important; backdrop-filter:blur(6px); }
  .leaflet-control-layers-expanded { padding:10px 12px; font-size:12.5px; }
  .leaflet-control-layers-separator { border-top-color:var(--line)!important; }
  .leaflet-bar a { background:#111827!important; color:var(--ink)!important; border-bottom-color:var(--line)!important; }
  .leaflet-bar { border:1px solid var(--line)!important; border-radius:10px!important; overflow:hidden; }
  .leaflet-control-attribution { background:rgba(11,15,23,.7)!important; color:#6b7890!important; }
  .leaflet-control-attribution a { color:#8a96ad!important; }
  .legend { padding:10px 12px; font-size:12.5px; line-height:1.9; }
  .sw { display:inline-block; width:20px; height:4px; border-radius:3px; margin-right:8px; vertical-align:middle; }
  @media (max-width:820px){ header{height:auto;flex-wrap:wrap;padding:12px 16px} .apibox{margin-left:0;flex-wrap:wrap} #api{width:100%}
    main{grid-template-columns:1fr;height:auto} #map{height:70vh} }
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo"></div>PathSnap <small>Evaluator</small></div>
  <div class="apibox">
    <label for="api">API</label>
    <input id="api" value="http://localhost:8000" spellcheck="false">
    <button class="btn" id="connect">Load trips</button>
  </div>
  <div class="pill" id="pill"><span class="dot"></span><span id="status">Not connected</span></div>
</header>
<main>
  <aside>
    <h2>Evaluation trips</h2>
    <div id="trips"><span class="hint">Enter the API address and press “Load trips”.</span></div>
    <h2>Results</h2>
    <div id="results"><span class="hint">Select a trip to run the pipeline.</span></div>
  </aside>
  <div id="map"></div>
</main>
<script>
const map = L.map('map', {zoomControl:true}).setView([20, 0], 2);
// Esri basemaps need no API key (CartoDB now returns "API key required" tiles)
const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
// "Dark detailed": the full-detail Esri street map, colour-inverted by CSS into a dark theme
const dark = L.tileLayer(ESRI + 'World_Street_Map/MapServer/tile/{z}/{y}/{x}', {attribution:'Tiles &copy; Esri', maxZoom:19, className:'dark-tiles'}).addTo(map);
const satImg = L.tileLayer(ESRI + 'World_Imagery/MapServer/tile/{z}/{y}/{x}', {attribution:'Tiles &copy; Esri', maxZoom:19});
const satRoads = L.tileLayer(ESRI + 'Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', {maxZoom:19});
const satNames = L.tileLayer(ESRI + 'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {maxZoom:19});
const sat = L.layerGroup([satImg, satRoads, satNames]);
const streets = L.tileLayer(ESRI + 'World_Street_Map/MapServer/tile/{z}/{y}/{x}', {attribution:'Tiles &copy; Esri', maxZoom:19});
const darkLabels = L.tileLayer(ESRI + 'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {maxZoom:19, className:'dark-tiles'});
// drawing order: GPS dots at the bottom, classifier-only above, HMM route on top
map.createPane('gpsPane').style.zIndex = 410;
map.createPane('clfPane').style.zIndex = 420;
map.createPane('routePane').style.zIndex = 430;
const gpsLayer = L.layerGroup().addTo(map), predLayer = L.layerGroup().addTo(map), clfLayer = L.layerGroup();
L.control.layers({'Dark (detailed)':dark, 'Satellite + roads':sat, 'Streets (light)':streets},
  {'Place labels':darkLabels, 'Raw GPS':gpsLayer, 'Predicted route (classifier + HMM)':predLayer, 'Classifier-only (no HMM)':clfLayer},
  {collapsed:false}).addTo(map);
const legend = L.control({position:'bottomleft'});
legend.onAdd = () => { const d = L.DomUtil.create('div','legend');
  d.innerHTML = '<div><span class="sw" style="background:var(--gps)"></span>Raw GPS</div>'+
                '<div><span class="sw" style="background:var(--route);box-shadow:0 0 6px var(--route)"></span>Predicted route (HMM)</div>'+
                '<div><span class="sw" style="background:var(--clf)"></span>Classifier-only</div>'; return d; };
legend.addTo(map);

const $ = id => document.getElementById(id);
const api = () => $('api').value.replace(/\/+$/, '');
const pct = x => (x == null ? '—' : (100 * x).toFixed(2) + '%');
function setStatus(text, state) { $('status').textContent = text; $('pill').className = 'pill ' + (state || ''); }

// optional deep link: index.html?api=http://host:8000&trip=00000015
const params = new URLSearchParams(location.search);
if (params.get('api')) $('api').value = params.get('api');
window.addEventListener('load', async () => {
  if (!params.get('api')) return;
  await $('connect').onclick();
  const t = params.get('trip');
  const b = [...document.querySelectorAll('.trip')].find(x => x.textContent === t);
  if (b) run(t, b);
});

$('connect').onclick = async () => {
  setStatus('Connecting…', 'busy');
  try {
    const r = await fetch(api() + '/trips'); if (!r.ok) throw new Error(r.status);
    const {trips} = await r.json();
    $('trips').innerHTML = '';
    trips.forEach(t => { const b = document.createElement('button'); b.className = 'trip'; b.textContent = t;
      b.onclick = () => run(t, b); $('trips').appendChild(b); });
    setStatus(`Connected · ${trips.length} trips`, 'ok');
  } catch (e) { setStatus('Could not reach API: ' + e.message, 'err'); }
};

async function run(tid, btn) {
  document.querySelectorAll('.trip').forEach(b => b.classList.remove('active')); btn.classList.add('active');
  setStatus(`Running pipeline for ${tid}…`, 'busy'); $('results').innerHTML = '<div class="spinner"></div>';
  try {
    const r = await fetch(api() + '/predict', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({trip_id:tid})});
    if (!r.ok) throw new Error(await r.text());
    const d = await r.json(); draw(d); show(d);
    setStatus(`Done · ${tid} in ${d.timing_s.request_total}s`, 'ok');
  } catch (e) { setStatus('Error: ' + e.message, 'err'); $('results').innerHTML = ''; }
}

function draw(d) {
  gpsLayer.clearLayers(); predLayer.clearLayers(); clfLayer.clearLayers();
  d.gps.forEach(p => L.circleMarker(p, {pane:'gpsPane', radius:2.2, color:'#38bdf8', weight:0, fillOpacity:.6}).addTo(gpsLayer));
  d.classifier_only_route.forEach(l => L.polyline(l, {pane:'clfPane', color:'#fbbf24', weight:3, opacity:.9, dashArray:'4 5'}).addTo(clfLayer));
  d.predicted_route.forEach(l => {
    L.polyline(l, {pane:'routePane', color:'#ff4d6d', weight:12, opacity:.18}).addTo(predLayer);   // glow
    L.polyline(l, {pane:'routePane', color:'#ff4d6d', weight:4.5, opacity:1}).addTo(predLayer);
  });
  const se = (p, c, t) => L.marker(p, {pane:'routePane', title:t, icon:L.divIcon({className:'', iconSize:[20,20],
    html:`<div class="se-marker" style="background:${c};box-shadow:0 0 10px ${c}"></div>`})}).bindTooltip(t).addTo(predLayer);
  se(d.gps[0], '#34d399', 'Start'); se(d.gps[d.gps.length - 1], '#ff4d6d', 'End');
  map.fitBounds(L.latLngBounds(d.gps), {padding:[30,30]});
}

function bar(label, v, cls) {
  const w = v == null ? 0 : Math.max(0, Math.min(100, 100 * v));
  return `<div class="bar"><div class="row"><span>${label}</span><b>${pct(v)}</b></div>
          <div class="track"><div class="fill ${cls||''}" style="width:${w}%"></div></div></div>`;
}

function show(d) {
  const m = d.metrics;
  if (!m) { $('results').innerHTML = '<span class="hint">No reference available on the server for this trip.</span>'; return; }
  const a = m.all_observations, rt = m.route;
  const gain = 100 * (a.hmm_top1 - a.classifier_top1);
  $('results').innerHTML = `
    <div class="hero">
      <div class="k">Top-1 accuracy · classifier + HMM</div>
      <div class="v">${pct(a.hmm_top1)}</div>
      <span class="gain">${gain >= 0 ? '+' : ''}${gain.toFixed(2)} pts</span><span class="sub">vs classifier only (${pct(a.classifier_top1)})</span>
    </div>
    <div class="bars">
      ${bar('Route F1 (length-weighted)', rt.f1)}
      ${bar('Route continuity', rt.continuity)}
      ${bar('Route precision', rt.precision)}
      ${bar('Route recall', rt.recall)}
      ${bar('Top-1 classifier only', a.classifier_top1, 'clf')}
    </div>
    <div class="meta">
      <div class="chip"><div class="k">GPS fixes</div><div class="v">${d.n_observations.toLocaleString()}</div></div>
      <div class="chip"><div class="k">Decoded</div><div class="v">${d.n_decoded.toLocaleString()}</div></div>
      <div class="chip"><div class="k">Route km</div><div class="v">${rt.pred_km.toFixed(2)} <span class="sub" style="margin:0">/ ${rt.ref_km.toFixed(2)} ref</span></div></div>
      <div class="chip"><div class="k">Time</div><div class="v">${d.timing_s.request_total}s</div></div>
    </div>
    <div class="foot">Model <code>${d.model}</code> · features ${d.timing_s.features}s · classifier ${d.timing_s.classifier}s ·
      Viterbi ${d.timing_s.viterbi}s · ${a.labeled.toLocaleString()} fixes with a server-side reference label.</div>`;
}
</script>
</body>
</html>
